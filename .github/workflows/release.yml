# Publishes the packages to npm when a release is published from the GitHub UI.
#
# The flow is: you create a release on GitHub → the full check suite runs → if
# and only if it is green, the packages go to npm.
#
# What gets published is whatever version sits in each `package.json` **at the
# commit the release tag points at**. So the order is always: merge the "Version
# packages" pull request first, then create the release from the resulting
# commit. Publishing a tag from before the bump would re-publish the version
# that is already online, which the publish script detects and skips.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The exact same suite pull requests have to pass. Nothing is published if
  # anything here is red.
  check:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A GitHub Environment lets you require a manual approval before the token
    # is ever handed out. Create it in Settings → Environments, or delete these
    # two lines if you would rather publish without a gate.
    environment: npm

    # Actions are pinned to full commit SHAs — this job holds the npm token, so a
    # moved tag must not be able to change the code that sees it. See `ci.yml`.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # npm does not publish anything here — `bun publish` does, because it is
      # the one that rewrites the `workspace:` ranges. npm is only used by the
      # publish script to ask the registry whether a version already exists,
      # which needs no credentials.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install
        run: bun install --frozen-lockfile

      # Only the two published packages: the docs site and the examples have
      # nothing to do with a release.
      - name: Build the packages
        run: bun run --filter './packages/*' build

      # A missing secret is not an error to GitHub: `${{ secrets.NPM_TOKEN }}`
      # expands to an empty string, the step goes green, and the failure only
      # surfaces at `bun publish` as `missing authentication` — which reads like
      # a Bun problem rather than a settings one. Failing here, by name, is the
      # difference between a two-minute fix and an afternoon.
      - name: Check the npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty. Set it as a repository secret, or in Settings → Environments → npm."
            exit 1
          fi
          # `~/.npmrc` for npm — the publish script asks the registry which
          # versions already exist, and other tooling expects to find it there.
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          # Confirms the token is real without needing the right to publish, and
          # prints the account rather than the token. A warning, never a
          # failure: a token allowed to publish but not to answer this endpoint
          # must not stop a release.
          npm whoami || echo "::warning::npm whoami could not confirm the token — publishing anyway."

      # `NPM_CONFIG_TOKEN`, not the `~/.npmrc` written above: the release of
      # 2026-07-31 wrote that file with a valid token and `bun publish` still
      # said `missing authentication`. The same Bun version, 1.3.11, reads
      # `$HOME/.npmrc` correctly on macOS, so what differs is the runner, and
      # the cause is still unknown. This variable is read before any file is
      # looked for, which takes the question out of the release path. It stays
      # in the environment, never in the command line, so it cannot land in a
      # log.
      - name: Publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release:publish

      - name: Forget the credentials
        if: always()
        run: rm -f ~/.npmrc
