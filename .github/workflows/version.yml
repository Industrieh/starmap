# Keeps a "Version packages" pull request open, ready to merge.
#
# Every push to `main` carrying changeset files makes this workflow open — or
# update — a single pull request that consumes them: it bumps the versions,
# writes the CHANGELOG entries, and deletes the changeset files. Merging that
# pull request is what decides a release exists. Creating the GitHub release is
# what ships it.
#
# This workflow **never publishes**. That is `release.yml`, and only from the
# GitHub release UI.
#
# It is a convenience, not a requirement: `bun run changeset:version` on your
# machine, committed by hand, does exactly the same thing. Delete this file if
# you would rather not have a bot opening pull requests.
#
# ## Checking the version pull request
#
# A pull request opened with the default `GITHUB_TOKEN` does not trigger any
# other workflow — GitHub's rule, there to stop workflows from triggering each
# other in a loop. So `ci.yml` never runs on the version pull request by itself,
# and a bump that breaks something (`bun.lock` after `scripts/relock.ts`, a
# CHANGELOG the formatter rejects) would be merged unchecked.
#
# The `check` job below closes that gap: it runs the same `ci.yml` on the version
# branch, right after the pull request was created or updated. Its result shows
# on this workflow run — in the Actions tab — not as a check on the pull request
# itself, so look there before merging.
#
# To get real checks on the pull request instead, give `changesets/action` a
# token that is not `GITHUB_TOKEN`: a GitHub App installation token (see
# `actions/create-github-app-token`) or a fine-grained personal access token
# with `contents: write` and `pull-requests: write`, stored as a secret and
# passed as the action's `github-token:` input. Pull requests it opens then
# trigger `ci.yml` like any other, and the `check` job becomes redundant.
name: Version

on:
  push:
    branches: [main]

concurrency:
  group: version
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}

    # Actions are pinned to full commit SHAs. See `ci.yml`.
    steps:
      # The action compares against the base branch, so it needs real history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      # No `publish:` input on purpose — without it the action only ever opens
      # the version pull request. npm is out of its reach.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bun run changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # `hasChangesets` is true exactly when there were changesets to consume — and
  # then the action has just pushed `changeset-release/<branch>` and created or
  # updated the pull request from it. With none, the action did nothing, and
  # there is nothing new to check.
  check:
    name: CI on the version branch
    needs: version
    if: ${{ needs.version.outputs.has-changesets == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: changeset-release/${{ github.ref_name }}
